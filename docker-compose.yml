# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: recruitflow_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recruitflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d recruitflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: recruitflow_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: